[package]
name = "batch_invoice"
version = "0.1.0"
edition = "2021"
default-run = "batch_invoice"

[[bin]]
name = "mnemonic-to-xprv"
path = "src/bin/mnemonic_to_xprv.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
chrono = { version = "0.4", features = ["clock"] }
bitcoin = "0.32"
bitcoin_hashes = "0.12"
hex = "0.4"
urlencoding = "2"
secrecy = "0.8"
anyhow = "1"
dotenvy = "0.15"
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
